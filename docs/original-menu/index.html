  --char:#2E2D2B; --char2:#45423E; --line:rgba(46,45,43,.14);
  --paper:#EDEAE4; --paper2:#DFDBD4; --card:#F8F6F2;
  --gold:#A67C33; --gold-l:#C08F3C; --sage:#5E6B45;
  --cream:#F4ECDD; --muted:#6F6B64;
  --en:'Cormorant Garamond',Georgia,serif; --ui:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper2);color:var(--char);font-family:var(--ui);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#shell{position:relative;width:100%;height:100dvh;overflow:hidden;background:linear-gradient(180deg,#F1EEE9,#DEDAD3)}
@media (min-width:520px) and (min-height:720px){
  body{display:grid;place-items:center;background:#C9C5BE}
  #shell{width:390px;height:800px;border-radius:44px;box-shadow:0 0 0 10px #2E2D2B,0 0 0 12px #4A4744,0 50px 90px rgba(40,38,35,.4)}
}
.tex{position:absolute;inset:0;background-image:var(--stonepic);background-size:cover;background-position:center;opacity:.13;filter:grayscale(1) brightness(1.5);mix-blend-mode:multiply}
.vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 18%,rgba(255,255,255,.5),rgba(46,45,43,.12) 88%);pointer-events:none}

/* ---------- app ---------- */
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.logo{background:var(--logodark) center/contain no-repeat}
.logo.sm{width:112px;height:36px}
.ver{text-align:center;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);opacity:.7;margin-top:22px}
.top{position:relative;z-index:2;padding:calc(env(safe-area-inset-top) + 16px) 18px 8px;display:flex;align-items:center;gap:12px}
.back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--char);font-size:17px;flex:0 0 auto}
.brandwrap{flex:1;display:flex;justify-content:center}
.pad{width:34px;flex:0 0 auto}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 18px calc(env(safe-area-inset-bottom) + 34px);position:relative;z-index:2;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.view{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1.t{font-family:var(--en);font-size:34px;font-weight:400;margin:14px 0 4px;letter-spacing:.5px}
.sub{font-size:11px;letter-spacing:3.4px;color:var(--gold);text-transform:uppercase}
.note{font-family:var(--en);font-size:15px;font-style:italic;color:var(--muted);line-height:1.7;margin:12px 0 4px}

/* brief */
.brief{text-align:center;margin-top:26px}
.brief .logo{margin:0 auto 16px}
.brief p{font-family:var(--en);font-size:18px;line-height:1.85;color:var(--char);margin:0 4px}
.brief .en{font-family:var(--en);font-size:15px;font-style:italic;letter-spacing:.6px;color:var(--muted);margin-top:14px}
.rule{display:flex;align-items:center;gap:12px;margin:28px 0 4px}
.rule:before,.rule:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(166,124,51,.5),transparent)}
.rule span{font-size:10.5px;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}

/* section cards */
.groups{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.group{display:flex;align-items:center;gap:16px;text-align:start;padding:16px 18px;border-radius:18px;
  background:var(--char);border:1px solid rgba(255,255,255,.06);box-shadow:0 10px 22px rgba(46,45,43,.18)}
.group:active{background:#3A3835}
.group .txt{flex:1}
.group .txt .a{font-family:var(--en);font-size:26px;line-height:1.1;color:#F4F1EB}
.group .txt .n{font-size:11.5px;letter-spacing:.4px;color:#A9A297;margin-top:5px}
.group .ch{color:#A9A297;font-size:16px;opacity:.8}
.ico{width:52px;height:52px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid rgba(192,143,60,.45);color:var(--gold-l)}
.ico svg{width:26px;height:26px}

/* section page */
.chips{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;margin:14px -18px 0;padding:10px 18px;
  background:linear-gradient(180deg,rgba(237,234,228,.97) 70%,rgba(237,234,228,0));backdrop-filter:blur(6px);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;
  font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--char2);flex:0 0 auto}
.chip.on{background:var(--char);color:#F4F1EB;border-color:var(--char)}
body.ar .chip{letter-spacing:0;text-transform:none;font-size:13px}
.sec{margin-top:26px;scroll-margin-top:58px}
.sec h2{font-family:var(--en);font-size:13px;font-weight:400;letter-spacing:3.4px;text-transform:uppercase;
  color:var(--gold);margin:0 0 2px}
.sec .line{height:1px;background:var(--line);margin-bottom:2px}

/* plates */
.pl{position:relative;flex:0 0 auto;display:grid;place-items:center}
.pl .shadow{position:absolute;bottom:2%;width:74%;height:16%;border-radius:50%;background:rgba(46,45,43,.26);filter:blur(7px)}
.pl .tilt{width:100%;height:100%;transform:perspective(620px) rotateX(var(--tilt,26deg))}
.pl .spin{width:100%;height:100%;animation:rot var(--dur,16s) linear infinite;animation-direction:var(--dir,normal)}
.pl svg{width:100%;height:100%;display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.pl.g{width:82px;height:82px;--tilt:24deg}
.pl.m{width:120px;height:120px;--tilt:30deg}
.pl.xl{width:min(74vw,268px);height:min(74vw,268px);--tilt:38deg;touch-action:none;user-select:none;-webkit-user-select:none}

/* dish grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);box-shadow:0 8px 18px rgba(46,45,43,.08);
  border-radius:16px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.card:active{border-color:rgba(166,124,51,.6)}
.card .a{font-family:var(--en);font-size:17px;line-height:1.25}
.card .p{font-family:var(--en);font-size:14px;color:var(--gold);letter-spacing:1px}

/* dish detail */
.hero{display:grid;place-items:center;margin:6px 0 2px}
.hint{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);margin-top:8px;transition:opacity .4s}
.hint.off{opacity:0}
.dt{text-align:center;margin-top:8px}
.dt .a{font-family:var(--en);font-size:30px;line-height:1.2}
.dt .e{font-size:10.5px;letter-spacing:3.2px;color:var(--gold);text-transform:uppercase;margin-top:6px}
.tags{display:flex;justify-content:center;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.tag{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--sage);
  border:1px solid rgba(94,107,69,.4);background:rgba(94,107,69,.07);border-radius:999px;padding:5px 11px}
.desc{text-align:center;font-family:var(--en);font-size:17px;line-height:1.8;color:var(--char2);margin:10px 6px}
.price{font-family:var(--en);font-size:26px;color:var(--gold);letter-spacing:1px;text-align:center;
  border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.also{margin-top:28px}
.also h3{font-size:10.5px;font-weight:400;letter-spacing:3.2px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.strip{display:flex;gap:12px}
.strip .card{flex:1;padding:10px 6px}
.strip .pl.m{width:72px;height:72px}
.strip .card .a{font-size:14px}
.strip .card .p{font-size:12px}
.ghost{margin:28px auto 0;display:block;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:10px 22px;color:var(--char2);font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase}
body.ar{--en:'Amiri',Georgia,serif;--ui:'Tajawal',system-ui,sans-serif}
body.ar h1.t{font-size:29px}
body.ar .brief p{font-size:17.5px;line-height:2.05}
body.ar .desc{font-size:15px;line-height:1.95}
body.ar .card .a{font-size:16px}
body.ar .group .txt .a{font-size:22px}
body.ar .dt .a{font-size:27px}
body.ar .sub,body.ar .sec h2,body.ar .tag,body.ar .hint,body.ar .also h3,body.ar .ghost,body.ar .enter{letter-spacing:0;text-transform:none}
[dir=rtl] .group .ch,[dir=rtl] .back{transform:scaleX(-1)}
.lang{width:42px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--char2);font-size:11px;letter-spacing:1.4px;display:grid;place-items:center;flex:0 0 auto}
.kcal{text-align:center;font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);margin-top:8px}
body.ar .kcal{letter-spacing:0;text-transform:none;font-size:12.5px}
@media (prefers-reduced-motion:reduce){
  .pl .spin{animation:none}
  .view{animation:none}
}
</style>

/* ================= plate art ================= */
function seedOf(s){let h=2166136261;for(const ch of s)h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0;return h}
function rngOf(s){let a=seedOf(s);return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=(r,a,b)=>a+r()*(b-a);
function blob(r,rad,wob,cx=100,cy=100){let d='';for(let i=0;i<26;i++){const a=i/26*Math.PI*2,rr=rad+Math.sin(i*2.3)*wob*.6+R(r,-wob,wob)*.5;
  const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}return d+'Z'}
function dots(r,n,rad,size,fill,op=1){let s='';for(let i=0;i<n;i++){const a=R(r,0,Math.PI*2),d=Math.sqrt(r())*rad;
  s+=`<circle cx="${(100+Math.cos(a)*d).toFixed(1)}" cy="${(100+Math.sin(a)*d).toFixed(1)}" r="${R(r,size*.6,size).toFixed(1)}" fill="${fill}" opacity="${op}"/>`}return s}

function inner(it,r){
  const c=it.c;
  switch(it.art){
    case 'dip':return `<path d="${blob(r,54,7)}" fill="${c}"/>
      <path d="M100 60 A40 40 0 1 1 62 108" fill="none" stroke="rgba(0,0,0,.16)" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="112" cy="86" rx="22" ry="15" fill="#8a7326" opacity=".55"/>
      ${dots(r,7,34,4.5,'#efe6cf',.9)}${dots(r,14,46,2.4,'#5f7a3c',.85)}${dots(r,20,50,1.6,'#8d3720',.6)}`;
    case 'salad':{let s='';for(let i=0;i<70;i++){const a=R(r,0,Math.PI*2),d=Math.sqrt(r())*52,x=100+Math.cos(a)*d,y=100+Math.sin(a)*d;
      const col=[c,'#6f8f42','#3f5c2a','#a52a2a','#efe3c8','#c2b280'][Math.floor(r()*6)];
      s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${R(r,4,9).toFixed(1)}" height="${R(r,3,6).toFixed(1)}" rx="1.6" fill="${col}" transform="rotate(${(r()*360).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`}
      return `<circle cx="100" cy="100" r="56" fill="#EFE9DA"/>${s}`}
    case 'rolls':{let s='';for(let i=0;i<7;i++){const a=i/7*Math.PI*2;const x=100+Math.cos(a)*32,y=100+Math.sin(a)*32;
      s+=`<g transform="rotate(${(a*180/Math.PI+90).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"><rect x="${(x-22).toFixed(1)}" y="${(y-7).toFixed(1)}" width="44" height="14" rx="7" fill="${c}"/>
      <path d="M${(x-18).toFixed(1)} ${y.toFixed(1)} h36" stroke="#33421f" stroke-width="1.4" opacity=".8"/></g>`}
      return s+`<circle cx="100" cy="100" r="15" fill="#e8dc9a"/><path d="M100 85 V115 M85 100 H115" stroke="#c9b96a" stroke-width="1.4"/>`}
    case 'bread':{const top=it.top;let s=`<circle cx="100" cy="100" r="63" fill="${c}"/>${dots(r,50,58,3.2,'#8a6432',.35)}`;
      if(top==='zaatar')s+=`<path d="${blob(r,46,6)}" fill="#4e6130" opacity=".9"/>${dots(r,30,44,2.2,'#2f3d1c',.8)}${dots(r,10,40,2.6,'#c9a94b',.5)}`;
      if(top==='cheese')s+=`<path d="${blob(r,46,7)}" fill="#f3e6c4"/>${dots(r,12,40,5,'#e7c98a',.7)}${dots(r,8,42,3,'#b98b3f',.55)}`;
      return s+`<path d="M46 92 q18 -14 34 -2" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="2.4" stroke-linecap="round"/>`}
    case 'ring':return `<path d="M100 34 A66 66 0 1 1 99.9 34 Z M100 72 A28 28 0 1 0 100.1 72 Z" fill="${c}" fill-rule="evenodd"/>
      ${dots(r,55,58,1.9,'#f2e6c9',.75)}<path d="M52 76 q22 -16 46 -6" fill="none" stroke="rgba(255,236,190,.35)" stroke-width="3"/>`;
    case 'kefta':{let s='';for(let i=0;i<3;i++){const y=68+i*24;s+=`<rect x="42" y="${y}" width="116" height="17" rx="8.5" fill="${c}"/>
      <rect x="42" y="${y}" width="116" height="6" rx="3" fill="#a15a38" opacity=".55"/>${dots(r,6,52,2,'#2c1a12',.5)}`}
      return s+`<path d="M100 142 q14 10 26 4" stroke="#6f8f42" stroke-width="4" fill="none" stroke-linecap="round"/>`}
    case 'skewer':{let s='';for(let k=0;k<3;k++){const a=-24+k*24;s+=`<g transform="rotate(${a} 100 100)"><rect x="34" y="98" width="132" height="3" rx="1.5" fill="#9a9a9a"/>`;
      for(let i=0;i<4;i++)s+=`<rect x="${46+i*30}" y="86" width="26" height="27" rx="9" fill="${c}"/><rect x="${46+i*30}" y="86" width="26" height="9" rx="4" fill="#e3b775" opacity=".5"/>`;
      s+='</g>'}return s+dots(r,8,54,3,'#6f8f42',.8)}
    case 'chops':{let s='';for(let i=0;i<4;i++){const a=i/4*Math.PI*2+.5,x=100+Math.cos(a)*25,y=100+Math.sin(a)*25;
      s+=`<g transform="rotate(${(a*180/Math.PI).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"><ellipse cx="${x}" cy="${y}" rx="24" ry="18" fill="${c}"/>
      <rect x="${x+20}" y="${y-3}" width="20" height="6" rx="3" fill="#e8ddc6"/><ellipse cx="${x}" cy="${y}" rx="14" ry="9" fill="#5e2b1e" opacity=".55"/></g>`}
      return s+dots(r,14,52,2.2,'#8d3720',.6)}
    case 'mixed':return inner({...it,art:'skewer'},rngOf(it.id+'a'))+`<g transform="rotate(64 100 100)"><rect x="46" y="122" width="108" height="15" rx="7.5" fill="#7a3b26"/></g>
      ${dots(r,16,54,2.4,'#6f8f42',.7)}`;
    case 'drink':return `<circle cx="100" cy="100" r="62" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
      <circle cx="100" cy="100" r="54" fill="${c}"/>
      ${dots(r,5,40,9,'rgba(255,255,255,.28)')}
      <g transform="rotate(-18 100 100)"><ellipse cx="78" cy="76" rx="15" ry="10" fill="#4d7a35"/><path d="M78 76 h16" stroke="#2f5220" stroke-width="1.4"/></g>
      <rect x="112" y="46" width="7" height="82" rx="3.5" fill="#e6d6b8" opacity=".85" transform="rotate(14 115 90)"/>
      <path d="M62 78 a44 44 0 0 1 30 -22" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="4" stroke-linecap="round"/>`;
    case 'knafeh':{let s=`<circle cx="100" cy="100" r="58" fill="${c}"/>`;
      for(let i=0;i<40;i++){const a=i/40*Math.PI*2;s+=`<path d="M${(100+Math.cos(a)*22).toFixed(1)} ${(100+Math.sin(a)*22).toFixed(1)} L${(100+Math.cos(a)*57).toFixed(1)} ${(100+Math.sin(a)*57).toFixed(1)}" stroke="rgba(255,214,140,.5)" stroke-width="2.2" stroke-linecap="round"/>`}
      return s+`<circle cx="100" cy="100" r="22" fill="#f2e3c0"/>${dots(r,16,20,2.6,'#6f8f42',.95)}`}
    case 'baklava':{let s='';for(let i=0;i<5;i++){const a=i/5*Math.PI*2,x=100+Math.cos(a)*28,y=100+Math.sin(a)*28;
      s+=`<g transform="rotate(${(a*180/Math.PI+45).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"><rect x="${x-19}" y="${y-14}" width="38" height="28" rx="3" fill="${c}"/>
      <rect x="${x-19}" y="${y-14}" width="38" height="7" rx="3" fill="#efd79a" opacity=".7"/><circle cx="${x}" cy="${y}" r="4" fill="#6f8f42"/></g>`}
      return s+dots(r,10,52,1.8,'#f3e3b8',.6)}
    case 'cream':return `<circle cx="100" cy="100" r="56" fill="${c}"/><circle cx="100" cy="100" r="56" fill="none" stroke="rgba(0,0,0,.07)" stroke-width="10"/>
      ${dots(r,9,30,3.2,'#6f8f42',.95)}<g><ellipse cx="118" cy="82" rx="11" ry="7" fill="#dda0a8" transform="rotate(24 118 82)"/>
      <ellipse cx="82" cy="118" rx="9" ry="6" fill="#d3919b" transform="rotate(-32 82 118)"/></g>`;
    case 'coffee':return `<circle cx="100" cy="100" r="46" fill="#efe7d6"/><circle cx="100" cy="100" r="38" fill="${c}"/>
      <path d="M72 88 a34 34 0 0 1 24 -16" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="128" cy="128" rx="14" ry="9" fill="#8d7a4e" transform="rotate(38 128 128)"/>${dots(r,5,30,2.4,'#2a1a0f',.5)}`;
    case 'shisha':return `<circle cx="100" cy="100" r="58" fill="#4A423A"/><circle cx="100" cy="100" r="50" fill="${c}"/>
      <circle cx="100" cy="100" r="44" fill="#b9b4ab"/>${dots(r,26,38,2.2,'#3a352e',.9)}
      <g><circle cx="86" cy="92" r="13" fill="#5a4034"/><circle cx="86" cy="92" r="9" fill="#e8721f" opacity=".85"/>
      <circle cx="114" cy="104" r="12" fill="#5a4034"/><circle cx="114" cy="104" r="8" fill="#f0913a" opacity=".8"/>
      <circle cx="96" cy="118" r="11" fill="#4d372c"/><circle cx="96" cy="118" r="7" fill="#d75f18" opacity=".7"/></g>`;
    default:return `<circle cx="100" cy="100" r="54" fill="${c}"/>`;

}
function plateSVG(it){
  const r=rngOf(it.id);
  return `<svg viewBox="0 0 200 200" aria-hidden="true">
    <defs><filter id="fsh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#2E2D2B" flood-opacity=".38"/></filter></defs>
    <circle cx="100" cy="100" r="97" fill="#FDFBF6"/>
    <circle cx="100" cy="100" r="97" fill="none" stroke="rgba(46,45,43,.20)" stroke-width="1"/>
    <circle cx="100" cy="100" r="97" fill="none" stroke="#A67C33" stroke-opacity=".55" stroke-width="1.1"/>
    <circle cx="100" cy="100" r="84" fill="#F5F1E8"/>
    <circle cx="100" cy="100" r="70" fill="#FFFEFA"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(46,45,43,.10)" stroke-width="5"/>
    <g opacity=".9"><path d="M100 12 q7 6 0 12 q-7 -6 0 -12Z" fill="#A67C33" opacity=".9"/>
    <path d="M172 62 q7 5 1 11" fill="none" stroke="#A67C33" stroke-opacity=".6" stroke-width="1.4"/></g>
    <g filter="url(#fsh)">${inner(it,r)}</g>
  </svg>`;
}
function plate(it,size){
  const r=rngOf(it.id+'z'),dur=(13+r()*8).toFixed(1),dir=r()>.5?'normal':'reverse';
  return `<div class="pl ${size}"><div class="shadow"></div><div class="tilt"><div class="spin" style="--dur:${dur}s;--dir:${dir}">${plateSVG(it)}</div></div></div>`;
}

const main=document.getElementById('main'),backBtn=document.getElementById('back');
let stack=[];
function go(state){stack.push(state);render(state)}
backBtn.addEventListener('click',()=>{if(stack.length>1){stack.pop();render(stack[stack.length-1])}});
function render(s){
  backBtn.style.visibility=stack.length>1?'visible':'hidden';
  main.onscroll=null;main.scrollTop=0;
  if(s.v==='home')return home();
  if(s.v==='sec')return section(s.id);
  if(s.v==='dish')return dish(s.id);
}

      <span class="ico"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.3"
        stroke-linecap="round" stroke-linejoin="round">${ICONS[s.icon]}</svg></span>
      <div class="txt"><div class="a">${LANG==='ar'?s.an:s.name}</div><div class="n">${LANG==='ar'?s.ad:s.note}</div></div>
      <div class="ch">›</div></button>`).join('')}</div>
    <div class="ver">v13 · 1 Sep</div>`);
  main.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>go({v:'sec',id:b.dataset.s})));
}
function section(id){
  const s=SECTIONS.find(x=>x.id===id),multi=s.parts.length>1;
  html(`<h1 class="t">${LANG==='ar'?s.an:s.name}</h1><div class="sub">${L().sig}</div>
    <div class="note">${LANG==='ar'?s.ad:s.note}</div>
    ${multi?`<div class="chips" id="chips">${s.parts.map(([label,key,alabel],i)=>
      `<button class="chip${i?'':' on'}" data-go="sec-${key}">${LANG==='ar'?alabel:label}</button>`).join('')}</div>`:''}
    ${s.parts.map(([label,key,alabel])=>`<div class="sec" id="sec-${key}">
      ${(LANG==='ar'?alabel:label)?`<h2>${LANG==='ar'?alabel:label}</h2><div class="line"></div>`:''}
      <div class="grid">${G[key].map(i=>card(i)).join('')}</div></div>`).join('')}`);
  bindCards();
  if(multi)chipBar();
}
function chipBar(){
  const bar=document.getElementById('chips'),chips=[...bar.querySelectorAll('.chip')];
  chips.forEach(c=>c.addEventListener('click',()=>{
    const el=document.getElementById(c.dataset.go);
    main.scrollTo({top:el.offsetTop-main.offsetTop-54,behavior:'smooth'});
  }));
  const spy=()=>{
    let cur=chips[0];
    for(const c of chips){
      const el=document.getElementById(c.dataset.go);
      if(el.offsetTop-main.offsetTop-70<=main.scrollTop)cur=c;
    }
    if(!cur.classList.contains('on')){
      chips.forEach(c=>c.classList.toggle('on',c===cur));
      cur.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    }
  };
  main.onscroll=spy;
}
function card(i){
  return `<button class="card" data-dish="${i.id}">${plate(i,'m')}
    <div class="a">${nm(i)}</div><div class="p">${i.p.toFixed(2)} ${L().cur}</div></button>`;
}
function bindCards(){main.querySelectorAll('[data-dish]').forEach(b=>b.addEventListener('click',()=>go({v:'dish',id:b.dataset.dish})))}

function dish(id){
  const it=dishOf(id),also=groupOfDish(id).filter(x=>x.id!==id).slice(0,3);
  html(`<div class="hero">
      <div class="pl xl" id="hero"><div class="shadow"></div><div class="tilt"><div class="spin" id="heroSpin" style="animation:none">${plateSVG(it)}</div></div></div>
      <div class="hint" id="hint">${L().drag}</div>
    </div>
    <div class="dt"><div class="a">${nm(it)}</div><div class="e">${L().sig}</div></div>
    <div class="tags">${it.t.map(x=>`<span class="tag">${tg(x)}</span>`).join('')}</div>
    <div class="desc">${ds(it)}</div>
    <div class="price">${it.p.toFixed(2)} ${L().cur}</div>
    ${KCAL[it.id]?`<div class="kcal">${L().kcal(KCAL[it.id])}</div>`:''}
    <div class="also"><h3>${L().also}</h3><div class="strip">${also.map(i=>card(i)).join('')}</div></div>`);
  bindCards();
  spinner(document.getElementById('hero'),document.getElementById('heroSpin'),document.getElementById('hint'));
}

function applyLang(){
  document.documentElement.lang=LANG==='ar'?'ar':'en';
  document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.body.classList.toggle('ar',LANG==='ar');
  document.getElementById('lang').textContent=LANG==='ar'?'EN':'ع';
}
document.getElementById('lang').addEventListener('click',()=>{
  LANG=LANG==='ar'?'en':'ar';applyLang();
  if(stack.length)render(stack[stack.length-1]);
});
applyLang();
stack=[{v:'home'}];render(stack[0]);

/* drag-to-spin with momentum */
let raf=null;
function spinner(host,el,hint){
  cancelAnimationFrame(raf);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ang=0,vel=reduce?0:.35,drag=false,lastX=0,lastT=0;const base=reduce?0:.35;
  const tick=()=>{ang=(ang+vel)%360;el.style.transform=`rotate(${ang}deg)`;
    if(!drag){if(Math.abs(vel)>base)vel*=.96;else vel+=(base-vel)*.05}
    raf=requestAnimationFrame(tick)};
  tick();
  host.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastT=performance.now();host.setPointerCapture(e.pointerId);hint&&hint.classList.add('off')});
  host.addEventListener('pointermove',e=>{if(!drag)return;const now=performance.now(),dx=e.clientX-lastX,dt=Math.max(now-lastT,8);
    ang+=dx*.55;vel=Math.max(-14,Math.min(14,dx*.55/dt*16));lastX=e.clientX;lastT=now});
  const end=()=>{drag=false};
  host.addEventListener('pointerup',end);host.addEventListener('pointercancel',end);host.addEventListener('pointerleave',end);
}
</script>
